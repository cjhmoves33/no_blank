packages:
  - apps/*
  - packages/*

# 여러 패키지가 공유하는 의존성 버전을 한 곳에서 관리합니다. (package.json 에서 "catalog:" 로 참조)
catalog:
  typescript: ^5.9.3
  "@types/node": ^24.19.2
  # 모든 패키지가 같은 eslint 를 써야 typescript-eslint 플러그인 인스턴스가 하나로 유지됩니다.
  eslint: ^9.39.5

# pnpm 스크립트(pnpm dev, pnpm exec 등)를 실행하기 전에 node_modules 가 lockfile 과 일치하는지 확인하고,
# 다르면 pnpm install 을 자동으로 실행합니다. (예: git pull 로 팀원이 추가한 의존성을 받았을 때)
verifyDepsBeforeRun: install

# pnpm 10 은 의존성의 install 스크립트를 기본 차단합니다. 허용/무시할 패키지를 명시합니다.
onlyBuiltDependencies:
  - esbuild

ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
