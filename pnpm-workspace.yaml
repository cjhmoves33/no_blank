packages:
  - apps/*
  - packages/*

catalog:
  typescript: ^5.9.3
  "@types/node": ^24.19.2
  eslint: ^9.39.5
  # Vitest 5 는 vite 를 peer 의존성으로 요구합니다.
  vitest: ^5.1.0
  vite: ^8.3.8

allowBuilds:
  esbuild: true
  sharp: false
  unrs-resolver: false

# Node 24.13.1 미만은 한글이 들어간 경로에서 fs.rmSync 가 실패합니다(nodejs/node#61067).
engineStrict: true
