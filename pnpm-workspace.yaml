packages:
  - apps/*
  - packages/*

catalog:
  typescript: ^5.9.3
  "@types/node": ^24.19.2
  eslint: ^9.39.5
  # Vitest 5 는 vite 를 peer 의존성으로 요구합니다.
  vitest: ^5.1.0
  vite: ^8.3.8
  next: 16.4.6
  eslint-config-next: 16.4.6
  # workspace 패키지끼리는 peer 의존성이 앱 쪽 사본으로 풀리지 않습니다. web, 작업대, gym 이 three, fiber, react 를 한 사본으로 쓰도록 이 버전들은 여기서만 정합니다.
  three: 0.187.0
  "@types/three": 0.187.0
  "@react-three/fiber": 9.8.2
  "@react-three/test-renderer": 9.1.1
  react: 19.3.0
  react-dom: 19.3.1
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0

allowBuilds:
  esbuild: true
  sharp: false
  unrs-resolver: false

# Node 24.13.1 미만은 한글이 들어간 경로에서 fs.rmSync 가 실패합니다(nodejs/node#61067).
engineStrict: true

# 배포된 지 하루가 안 된 버전은 하루가 지난 버전이 범위 안에 있으면 고르지 않습니다.
# minimumReleaseAge 를 적으면 엄격 모드가 함께 켜져서, 하루가 안 된 버전만 있는 경우 설치를 거부합니다.
# 그러면 Dependabot 보안 업데이트 PR 이 막 배포된 패치를 lockfile 에 넣었을 때 CI 의 frozen 설치가 실패하므로 엄격 모드는 끕니다.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: false
