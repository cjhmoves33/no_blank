packages:
  - apps/*
  - packages/*

# 여러 패키지가 공유하는 의존성 버전을 한 곳에서 관리합니다. (package.json 에서 "catalog:" 로 참조)
catalog:
  typescript: ^5.9.3
  "@types/node": ^24.19.2
  # 모든 패키지가 같은 eslint 를 써야 typescript-eslint 플러그인 인스턴스가 하나로 유지됩니다.
  eslint: ^9.39.5
  # Vitest 5 는 vite 를 peer 의존성으로 요구합니다.
  vitest: ^5.1.0
  vite: ^8.3.8

allowBuilds:
  esbuild: true
  sharp: false
  unrs-resolver: false

# Node 24.13.1 미만은 한글이 들어간 경로에서 fs.rmSync 가 실패합니다(nodejs/node#61067).
engineStrict: true
