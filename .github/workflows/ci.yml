name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Code checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUSKY: 0
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm check

  docker:
    name: Docker smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Build images
        run: docker compose build

      - name: Start stack
        run: docker compose up -d

      - name: Wait for the home page canvas and the API health check
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000 | grep -q "<canvas" &&
              curl -fsS http://localhost:4000/api/health; then
              echo "The home page canvas is served on http://localhost:3000 and http://localhost:4000/api/health returns 200"
              exit 0
            fi
            sleep 2
          done
          echo "Timed out waiting for the home page canvas and the API health check"
          exit 1

      - name: Show logs
        if: failure()
        run: docker compose logs

      - name: Stop stack
        if: always()
        run: docker compose down -v
